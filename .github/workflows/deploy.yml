name: Deploy Portfolio and todo list

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: task1_portfolio

      - name: Deploy
        uses: actions/deploy-pages@v4
